services:
  db:
    image: postgres:16-alpine
    container_name: patients-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: patients_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: patients_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patients_user -d patients_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: